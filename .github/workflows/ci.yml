name: CI

# Pull requests only. Pushes to main deliberately run nothing — releases are
# cut by tag, and release.yml runs these same checks before it builds.
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Matches the release job's platform: Windows is the only build target, and
    # a check that passes here is a check that passes where the app ships.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      # Nobody was running these but whoever happened to remember. The suite
      # had reached forty-one tests before anyone noticed CI never called it.
      - name: Test
        run: npm test

      # And these were worse off: they run under Electron's Node against the
      # real native SQLite, so they stayed out of CI — and when the suite was
      # split on 2026-10-01 the move to tests/electron/ left their relative
      # requires one level short. They threw on the first line for three days
      # and nothing noticed. Running them here is the only way that does not
      # happen again.
      - name: Test (ARAM, Electron)
        run: npm run test:aram

      # electron-vite does not typecheck, so this catches what tsc cannot:
      # anything that only fails once the bundler resolves it.
      - name: Build
        run: npm run build
